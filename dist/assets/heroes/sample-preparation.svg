<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-sample-preparation desc-sample-preparation"><title id="title-sample-preparation">Anonymized source sheet</title><desc id="desc-sample-preparation">Identifiers become neutral blocks in a clearly illustrative document; no actual uploads. No sensitive uploads on the public site</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#E8EFED"/><rect class="" x="148" y="75" width="382" height="270" rx="6" fill="white" stroke="#CCD5C9"/><text x="173" y="112" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450">Permissioned sample</text><text x="175" y="149" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Field 1</text><rect class="range" x="247" y="136" width="110" height="16" rx="2" fill="#DCE5DB" stroke="none"/><text x="175" y="188" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Field 2</text><rect class="range" x="247" y="175" width="168" height="16" rx="2" fill="#DCE5DB" stroke="none"/><text x="175" y="227" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Field 3</text><rect class="range" x="247" y="214" width="94" height="16" rx="2" fill="#DCE5DB" stroke="none"/><text x="175" y="266" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Field 4</text><rect class="range" x="247" y="253" width="192" height="16" rx="2" fill="#DCE5DB" stroke="none"/><text x="174" y="323" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">Synthetic redaction example; no source upload.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Anonymized source sheet</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">No sensitive uploads on the public site</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 19</text></svg>