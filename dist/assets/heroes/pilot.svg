l,sans-serif" font-size="18" font-weight="550">Bounded pilot folio</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Hypothetical test pricing</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 14</text></svg>