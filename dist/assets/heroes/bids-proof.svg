1" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">DEMO — SYNTHETIC DATA</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 05</text></svg>