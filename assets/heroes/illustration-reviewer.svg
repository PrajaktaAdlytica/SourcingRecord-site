<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="Illustrative reviewer role with a pending decision record"><style>.arrival{animation:arrive .6s ease-out both}.d{animation-delay:.16s}.trace{stroke-dasharray:900;animation:trace 2.4s ease-out both}@keyframes arrive{from{transform:translateY(8px)}to{transform:translateY(0)}}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="680" height="400" fill="#F7F4EA"/><text x="40" y="42" font-family="Inter,Arial,sans-serif" font-size="18" fill="#263D34">The reviewer retains authority</text><text x="40" y="65" font-family="Inter,Arial,sans-serif" font-size="11" fill="#586B61">ILLUSTRATIVE ROLE · NOT A REAL EMPLOYEE</text><g class="arrival"><rect x="50" y="100" width="280" height="224" rx="8" fill="white" stroke="#CCD5C9"/><g stroke="#173E32" stroke-width="2" fill="none"><circle cx="190" cy="152" r="22"/><path d="M151 221v-13q0-26 39-26t39 26v13M139 227h102M162 259h56"/></g><text x="138" y="290" font-family="Inter,Arial,sans-serif" font-size="16" fill="#263D34">Named owner</text></g><g class="arrival d"><rect x="423" y="137" width="208" height="154" rx="8" fill="white" stroke="#CCD5C9"/><text x="443" y="168" font-family="Inter,Arial,sans-serif" font-size="16" fill="#263D34">Decision record</text><path d="M443 190h159M443 210h130" stroke="#788B7D"/><rect x="443" y="237" width="165" height="30" rx="4" fill="#F6E7CB"/><text x="455" y="257" font-family="Inter,Arial,sans-serif" font-size="13" fill="#835514">Pending human review</text></g><path class="trace" d="M330 212h93" stroke="#705123" stroke-width="1.5"/><text x="50" y="360" font-family="Inter,Arial,sans-serif" font-size="13" fill="#586B61">Motion connects evidence to the role. It never makes the decision.</text></svg>