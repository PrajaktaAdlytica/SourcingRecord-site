<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-terms desc-terms"><title id="title-terms">Numbered terms folio</title><desc id="desc-terms">Three numbered header rules settle once; legal text remains static. Draft specification; counsel review required</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.trace{animation-duration:180ms}</style><rect width="680" height="400" fill="#EFE8D8"/><rect class="" x="168" y="76" width="344" height="266" rx="6" fill="white" stroke="#CCD5C9"/><text x="193" y="113" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="450">Preview terms</text><text x="193" y="157" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">01  Concept preview</text><path class="trace" d="M193 172H488" stroke="#CCD5C9" fill="none"/><text x="193" y="210" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">02  Nonbinding drafts</text><path class="trace" d="M193 225H488" stroke="#CCD5C9" fill="none"/><text x="193" y="263" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">03  External actions disabled</text><path class="trace" d="M193 278H488" stroke="#CCD5C9" fill="none"/><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Numbered terms folio</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Draft specification; counsel review required</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 24</text></svg>