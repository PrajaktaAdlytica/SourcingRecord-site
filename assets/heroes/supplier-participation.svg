<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-supplier-participation desc-supplier-participation"><title id="title-supplier-participation">Consent correspondence</title><desc id="desc-supplier-participation">The invitation, scope and withdrawal route draw as three independent entries. Informational process</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#EEDDD5"/><rect class="settle d0" x="111" y="89" width="458" height="64" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="132" y="116" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450">01</text><text x="182" y="114" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450">Invitation</text><text x="182" y="135" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Purpose, terms and named owner</text><path class="trace" d="M147 153L147 174" stroke="#788B7D" fill="none"/><rect class="settle d1" x="111" y="174" width="458" height="64" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="132" y="201" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450">02</text><text x="182" y="199" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450">Participation</text><text x="182" y="220" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Optional delivery discussion only</text><path class="trace" d="M147 238L147 259" stroke="#788B7D" fill="none"/><rect class="settle d2" x="111" y="259" width="458" height="64" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="132" y="286" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450">03</text><text x="182" y="284" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450">Withdrawal</text><text x="182" y="305" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Decline or opt out at any point</text><text x="112" y="365" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">This sequence describes participation; it does not create consent.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Consent correspondence</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Informational process</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 18</text></svg>