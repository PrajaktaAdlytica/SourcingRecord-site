<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-bids-desk desc-bids-desk"><title id="title-bids-desk">Normalization concordance</title><desc id="desc-bids-desk">Two pack formats resolve to 200 pairs while source excerpts remain attached. DEMO — SYNTHETIC DATA</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#F7F4EA"/><rect class="settle" x="42" y="92" width="244" height="76" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="58" y="121" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Delta quote</text><text x="58" y="145" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">20 boxes × 10 pairs</text><rect class="settle d1" x="394" y="92" width="244" height="76" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="410" y="121" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Juniper quote</text><text x="410" y="145" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">10 boxes × 20 pairs</text><path class="trace" d="M164 168V210H340M516 168V210H340V244" stroke="#788B7D" fill="none"/><rect class="settle d2" x="215" y="244" width="250" height="74" rx="6" fill="#DCE5DB" stroke="none"/><text x="244" y="274" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="450">200 pairs</text><text x="244" y="299" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">SG-A v1 · reviewer confirmed</text><text x="46" y="351" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Original units remain attached to the normalized field.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Normalization concordance</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">DEMO — SYNTHETIC DATA</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 03</text></svg>