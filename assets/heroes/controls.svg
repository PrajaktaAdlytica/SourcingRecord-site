<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-controls desc-controls"><title id="title-controls">Authority margin</title><desc id="desc-controls">Authority path halts at human approval, with prohibited actions visibly blocked. Concept controls · no certifications claimed</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#173E32"/><rect class="settle" x="38" y="100" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="54" y="129" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Manager envelope</text><text x="54" y="153" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">15–30 days · fixed price</text><rect class="settle" x="376" y="100" width="268" height="76" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="392" y="129" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Human approval</text><text x="392" y="153" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Required before binding terms</text><path class="trace" d="M278 138H376" stroke="#D9B36C" fill="none"/><rect class="" x="92" y="256" width="218" height="52" rx="6" fill="#F6E7CB" stroke="none"/><text x="112" y="288" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">45-day proposal blocked</text><rect class="" x="360" y="256" width="250" height="52" rx="6" fill="#F8E3DD" stroke="none"/><text x="380" y="288" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Send / ERP / payment disabled</text><path d="M156 176V236M509 176V236" stroke="#788B7D" stroke-dasharray="4 4" fill="none"/><text x="38" y="38" fill="#F7F4EA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Authority margin</text><text x="38" y="61" fill="#DCE5DB" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Concept controls · no certifications claimed</text><text x="585" y="378" fill="#DCE5DB" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 12</text></svg>