<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-baseline-method desc-baseline-method"><title id="title-baseline-method">Method worksheet</title><desc id="desc-baseline-method">Three assumption cards settle; the 15-versus-30-day hold remains visible. Illustrative values only</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#F7F4EA"/><rect class="settle d0" x="42" y="104" width="190" height="116" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="57" y="134" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Prior comparable</text><text x="57" y="170" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="450">$1,140</text><text x="57" y="197" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">200 pairs; 15 days</text><rect class="settle d1" x="253" y="104" width="190" height="116" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="268" y="134" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Selected quote</text><text x="268" y="170" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="450">$1,020</text><text x="268" y="197" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">200 pairs; 30 days</text><rect class="settle d2" x="464" y="104" width="190" height="116" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="479" y="134" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Review effort</text><text x="479" y="170" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="450">$30</text><text x="479" y="197" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">0.5h × $60/h</text><path class="trace" d="M130 232V254H550V232" fill="none" stroke="#788B7D"/><rect class="" x="127" y="277" width="426" height="54" rx="4" fill="#F6E7CB" stroke="none"/><text x="145" y="300" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Comparability held: 15 vs 30 days</text><text x="145" y="319" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">No realized savings. Pilot fees excluded from this illustration.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Method worksheet</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Illustrative values only</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 17</text></svg>