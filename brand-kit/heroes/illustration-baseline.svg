<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-bids-report desc-bids-report"><title id="title-bids-report">Baseline bridge</title><desc id="desc-bids-report">Two directly labeled cost bars enter once; review cost and comparability hold stay visible. Illustrative; not realized savings</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#DCE5DB"/><rect class="" x="38" y="82" width="604" height="260" rx="6" fill="white" stroke="#CCD5C9"/><text x="60" y="112" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="450">Illustrative cost comparison · USD</text><text x="60" y="173" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Prior basis</text><rect class="range" x="173" y="156" width="342" height="28" rx="2" fill="#173E32" stroke="none"/><text x="548" y="176" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">$1,140</text><text x="60" y="238" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Quote total</text><rect class="range" x="173" y="221" width="306" height="28" rx="2" fill="#705123" stroke="none"/><text x="548" y="241" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">$1,020</text><text x="165.0" y="272" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">0</text><text x="285.0" y="272" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">400</text><text x="405.0" y="272" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">800</text><text x="525.0" y="272" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">1200</text><text x="60" y="313" fill="#835514" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">15 vs 30 days · comparability held · not realized savings</text><text x="60" y="359" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">Review cost $30 and pilot fee must be included in a reviewed net-value test.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Baseline bridge</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Illustrative; not realized savings</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 07</text></svg>