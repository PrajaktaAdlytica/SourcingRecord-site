<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-request-pilot desc-request-pilot"><title id="title-request-pilot">Inquiry sheet</title><desc id="desc-request-pilot">Source-sheet rules draw beside stationary field labels; no form is submitted. Form behavior must match connection status</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#F7F4EA"/><rect class="" x="127" y="81" width="426" height="252" rx="6" fill="white" stroke="#CCD5C9"/><text x="153" y="116" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="450">Category conversation</text><text x="155" y="151" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Work email</text><path class="trace" d="M155 165H523" stroke="#788B7D" fill="none"/><text x="155" y="199" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Role and company</text><path class="trace" d="M155 213H523" stroke="#788B7D" fill="none"/><text x="155" y="247" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Category / inquiry</text><path class="trace" d="M155 261H523" stroke="#788B7D" fill="none"/><text x="155" y="310" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">Purpose-limited opt-in · no raw RFQ upload</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Inquiry sheet</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Form behavior must match connection status</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 15</text></svg>