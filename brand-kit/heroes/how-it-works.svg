ill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Human</text><path class="trace" d="M538 193H554" stroke="#788B7D" fill="none"/><rect class="settle d0" x="554" y="146" width="116" height="98" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="568" y="177" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="450">05</text><text x="568" y="204" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">Handoff</text><text x="568" y="226" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Draft only</text><text x="29" y="302" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">The trace stops at review until a human acts.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Reviewed process strip</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">DEMO — SYNTHETIC DATA</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 08</text></svg>