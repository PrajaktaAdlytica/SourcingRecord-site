<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-bids-signal desc-bids-signal"><title id="title-bids-signal">Nonbinding redline</title><desc id="desc-bids-signal">15 days changes to a proposed 30; the line stops at human approval. DEMO — SYNTHETIC DATA</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#EEDDD5"/><rect class="" x="44" y="85" width="352" height="246" rx="6" fill="white" stroke="#CCD5C9"/><text x="65" y="117" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450">Juniper Goods · nonbinding draft</text><text x="65" y="156" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Requested delivery</text><text x="65" y="198" fill="#963F3A" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="450">15 days</text><path class="trace" d="M65 191H155" stroke="#963F3A" fill="none"/><text x="180" y="198" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="450">→</text><text x="217" y="198" fill="#25613F" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="450">30 days</text><text x="65" y="240" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Price: $1,020 · SG-A v1 fixed</text><text x="65" y="272" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">Envelope: 15–30 days</text><text x="65" y="304" fill="#963F3A" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Draft only · sending disabled</text><rect class="settle" x="436" y="135" width="202" height="76" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="452" y="164" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Lina Shaw</text><text x="452" y="188" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Pending human approval</text><path class="trace" d="M396 170H436" stroke="#788B7D" fill="none"/><text x="438" y="260" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Supplier consent recorded</text><text x="438" y="283" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">May withdraw</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Nonbinding redline</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">DEMO — SYNTHETIC DATA</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 06</text></svg>