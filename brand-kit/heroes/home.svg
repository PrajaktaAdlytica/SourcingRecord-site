" y="285" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">$1,040</text><text x="388" y="285" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450">20 days</text><text x="518" y="285" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Opted out</text><path class="trace" d="M628 244H657V340H463" fill="none" stroke="#705123" stroke-width="1.2"/><text x="50" y="355" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="450">Q-202-J · 12 Oct 2026 · source basis available</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Open ledger</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">DEMO — SYNTHETIC DATA</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 01</text></svg>