<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-contact desc-contact"><title id="title-contact">Correspondence desk</title><desc id="desc-contact">Envelope line opens once above contact paths; no response-time promise. Real contact details required before launch</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#EFE8D8"/><rect class="settle" x="88" y="108" width="270" height="194" rx="8" fill="#FFFFFF" stroke="#CCD5C9"/><path class="trace" d="M88 108L223 211L358 108M88 302L177 218M358 302L269 218" stroke="#788B7D" fill="none"/><path class="trace" d="M358 209H426" stroke="#705123" fill="none"/><rect class="settle d0" x="430" y="115" width="207" height="50" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="446" y="146" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Category pilot</text><rect class="settle d1" x="430" y="181" width="207" height="50" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="446" y="212" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">Partner inquiry</text><rect class="settle d2" x="430" y="247" width="207" height="50" rx="6" fill="#FFFFFF" stroke="#CCD5C9"/><text x="446" y="278" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450">General contact</text><text x="89" y="352" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="450">Contact details must be connected before launch.</text><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Correspondence desk</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Real contact details required before launch</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 21</text></svg>