<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title-resources desc-resources"><title id="title-resources">Guide shelf</title><desc id="desc-resources">Three guide folios settle gently; titles stay visible. Research guides</desc><style>
 .trace{stroke-dasharray:1200;stroke-dashoffset:0;animation:trace 2.8s cubic-bezier(.22,1,.36,1) both}
 .settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
 .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
 .range{animation:range 1.6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left}
 .review-dot{animation:review 2.8s ease-in-out both}
 @keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
 @keyframes settle{from{transform:translateY(12px)}to{transform:translateY(0)}}
 @keyframes range{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
 @keyframes review{from{transform:translateX(-160px)}to{transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="680" height="400" fill="#DCE5DB"/><rect class="settle d0" x="64" y="99" width="164" height="224" rx="2" fill="#EFE8D8" stroke="#788B7D"/><text x="82" y="138" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="450">01</text><text x="82" y="221" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450">Baseline</text><text x="82" y="247" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">method</text><path class="trace" d="M82 273H210" stroke="#788B7D" fill="none"/><rect class="settle d1" x="256" y="99" width="164" height="224" rx="2" fill="#DCE5DB" stroke="#788B7D"/><text x="274" y="138" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="450">02</text><text x="274" y="221" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450">Supplier</text><text x="274" y="247" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">participation</text><path class="trace" d="M274 273H402" stroke="#788B7D" fill="none"/><rect class="settle d2" x="448" y="99" width="164" height="224" rx="2" fill="#E8EFED" stroke="#788B7D"/><text x="466" y="138" fill="#705123" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="450">03</text><text x="466" y="221" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450">Sample</text><text x="466" y="247" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450">preparation</text><path class="trace" d="M466 273H594" stroke="#788B7D" fill="none"/><text x="38" y="38" fill="#263D34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550">Guide shelf</text><text x="38" y="61" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="450">Research guides</text><text x="585" y="378" fill="#586B61" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="450">SR / 16</text></svg>